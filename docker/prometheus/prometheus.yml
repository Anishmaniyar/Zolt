global:
  scrape_interval: 15s

scrape_configs:
  - job_name: zolt-api
    metrics_path: /metrics
    static_configs:
      - targets: ['host.docker.internal:9464']

  - job_name: zolt-scheduler
    metrics_path: /metrics
    static_configs:
      - targets: ['host.docker.internal:9465']

  - job_name: zolt-worker
    metrics_path: /metrics
    static_configs:
      - targets: ['host.docker.internal:9466']
