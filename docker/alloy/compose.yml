services:
  alloy:
    image: grafana/alloy:latest
    restart: unless-stopped
    command:
      - run
      - /etc/alloy/config.alloy
      - --server.http.listen-addr=0.0.0.0:12345
    ports:
      - '12345:12345'
    volumes:
      - ./config.alloy:/etc/alloy/config.alloy:ro
      - ../../logs:/var/log/zolt:ro
      - alloy_data:/var/lib/alloy
    depends_on:
      - loki

volumes:
  alloy_data:
